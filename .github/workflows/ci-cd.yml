name: CI/CD EliteGames

on:
  push:
    branches: [main]
    paths:
      - 'elitegamesFRONT/**' # Só roda a pipeline se mudar algo no frontend
  pull_request:
    branches: [main]
    paths:
      - 'elitegamesFRONT/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ========== CI ==========
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Define que todos os comandos 'run' vão rodar dentro da pasta do frontend
        working-directory: ./elitegamesFRONT 
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # O setup-node também precisa saber onde está o package-lock.json para o cache funcionar
          cache-dependency-path: './elitegamesFRONT/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint (validation)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload artifact for CD
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          # O caminho do artefato tem que apontar para a pasta dist dentro do frontend
          path: ./elitegamesFRONT/dist

  # ========== CD ==========
  cd:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5